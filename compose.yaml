services:
  mysql:
    image: mysql:8.4
    container_name: go-live-room-mysql
    environment:
      MYSQL_ROOT_PASSWORD: local-root-password
      MYSQL_DATABASE: live_room
      MYSQL_USER: live_app
      MYSQL_PASSWORD: local-app-password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-plocal-root-password"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    container_name: go-live-room-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  mysql_data:
  redis_data:
